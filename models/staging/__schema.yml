version: 2

models:
  - name: stg_meteo__daily
    description: "Staging model for daily weather data from Open Meteo API, deduplicated and cleaned for further analysis, after the dumb data dump"
    columns:
      - name: location_id
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: temp_max
        data_tests:
          - not_null
      - name: temp_min
        data_tests:
          - not_null

  - name: stg_meteo__cities
    columns:
      - name: location_id
        data_tests:
          - not_null
          - unique
      - name: city_name
        data_tests:
          - not_null
          - accepted_values:
              values: ['Glasgow', 'Dubai', 'Cairo']