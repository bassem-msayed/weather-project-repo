version: 2

sources:
 - name: meteo_raw
   database: meteo-historical-project
   schema: Meteo_Historical_Dataset
   tables:
      - name: fct_open_meteo_historical_data
      - name: raw_weather_daily
        description: "Raw landing table containing historical backfill and rolling weekly batches from Open-Meteo."
        # Tells dbt which timestamp column to evaluate against CURRENT_TIMESTAMP()
        loaded_at_field: extracted_at
        freshness:
          warn_after:
            count: 8
            period: day
          error_after:
            count: 14
            period: day
